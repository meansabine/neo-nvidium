modLoader = "javafml"
loaderVersion = "[4,)"
license = "LGPL-3.0-only"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "Nvidium (NeoForge Port)"
authors = "Cortex (Original), 1Influence (Port)"
description = '''
Unofficial NeoForge port of Nvidium for Minecraft 1.21.1.
'''
displayTest = "IGNORE_SERVER_VERSION"

[[mixins]]
config = "nvidium.mixins.json"

[[dependencies.nvidium]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.nvidium]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.nvidium]]
modId = "sodium"
type = "required"
versionRange = "[0.6.0,)"
ordering = "AFTER"
side = "CLIENT"
